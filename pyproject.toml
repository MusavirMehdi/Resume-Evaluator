[project]
name = "resumeparser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Musavir Mehdi", email = "mir.musavir14@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.14.3",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.40.0",
]

[project.scripts]
resumeparser = "resumeparser:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
